[package]
name = "streamnode-converter"
version = "1.0.0"
edition = "2021"
description = "Converts audio and video files into the format of a radio stream, or any format you set."

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11"] }
egui-phosphor = "0.14"
# File chooser. On Linux it asks the desktop (no GTK needed to build).
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
