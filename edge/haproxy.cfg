# HAProxy for an edge server: a second public entry point for the same domain.
# Streams are served by this server's own engine. Dashboard, API and
# certificate-validation requests are relayed to the main gateway.

global
    log stdout format raw local0 info
    maxconn 50000
    user haproxy
    group haproxy
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect          5s
    timeout http-request     10s
    timeout http-keep-alive  10s
    timeout client           60s
    timeout server           60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend network_ingress
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/stream.pem alpn h2,http/1.1

    acl is_management path_beg /admin /api
    acl is_acme       path_beg /.well-known/acme-challenge/
    acl is_root       path /
    acl force_https   env(FORCE_HTTPS) -m str true

    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http  if !{ ssl_fc }

    http-request redirect scheme https code 301 if is_management force_https !{ ssl_fc }
    http-request redirect location /admin/ code 302 if is_root

    use_backend main_gateway if is_acme || is_management
    default_backend streaming_engine_backend

# The main gateway's relay port, over the private network. The PROXY protocol
# carries the listener's real address, so rate limits and the audit log on the
# gateway see the client rather than this server.
backend main_gateway
    option httpchk GET /api/v1/health
    server gateway "${GATEWAY_PRIVATE_HOST}:${GATEWAY_RELAY_PORT}" send-proxy-v2 check inter 5s

backend streaming_engine_backend
    option http-no-delay
    retries 2
    retry-on conn-failure empty-response
    http-request set-header X-Engine-Auth "${ENGINE_SECRET}"
    option httpchk
    http-check send meth GET uri /healthz hdr X-Engine-Auth "${ENGINE_SECRET}"
    default-server inter 3s fall 3 rise 2
    server local "${ENGINE_HOST}:3000" check resolvers docker init-addr libc,none
