global
    log stdout format raw local0 info
    maxconn 50000
    # Started as root to read the certificate and bind 80/443, then drops privileges.
    user haproxy
    group haproxy
    # TLS 1.2 and newer: 1.3 alone would lock out hardware radios and older players.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    tune.ssl.default-dh-param 2048
    # Runtime API on the private network only (the port is not published). The
    # admin service uses it to add, drain and remove streaming servers.
    stats socket ipv4@*:9999 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    # Without this each frontend stops at HAProxy's built-in default of 2,000
    # connections, whatever the global limit above says.
    maxconn 50000
    option  httplog
    option  dontlognull
    timeout connect          5s
    timeout http-request     10s
    timeout http-keep-alive  10s
    # A listener that stops reading for this long is dropped.
    timeout client           60s
    timeout server           60s

# Docker's embedded DNS, so backends are re-resolved when containers restart.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend network_ingress
    bind *:80
    # With TLS_MODE=external the certificate lives on whatever is in front of
    # this server, so there is no HTTPS listener here and no certificate file.
.if strneq("$TLS_MODE",external)
    bind *:443 ssl crt /etc/haproxy/certs/stream.pem alpn h2,http/1.1
.endif
    # Dashboard and API requests relayed by edge servers that share this domain
    # (docs/SCALING.md). They arrive with the PROXY protocol, so the original
    # client address is kept. Never published on a public address.
    bind *:8444 accept-proxy id 8444
    option forwardfor

    acl is_management path_beg /admin /api
    acl is_acme       path_beg /.well-known/acme-challenge/
    acl is_root       path /

    # An edge server only relays requests it received over HTTPS. Matched by
    # listener id, because the PROXY protocol replaces the destination port.
    acl from_edge so_id 8444
    # TLS_MODE=external: the domain's certificate lives on a proxy or load
    # balancer in front of this server, which talks to it over plain HTTP.
    # Requests are then treated as HTTPS, and the client address is taken from
    # the last X-Forwarded-For entry, which that proxy added.
    acl external_tls env(TLS_MODE) -m str external
    http-request set-src hdr_ip(x-forwarded-for,-1) if external_tls { req.hdr(x-forwarded-for) -m found }
    http-request set-header X-Forwarded-Proto https if { ssl_fc } || from_edge || external_tls
    http-request set-header X-Forwarded-Proto http  if !{ ssl_fc } !from_edge !external_tls

    # Per-address request rate limit on the management API (not on streams).
    stick-table type ipv6 size 100k expire 1m store http_req_rate(10s)
    http-request track-sc0 src if is_management
    http-request deny deny_status 429 if is_management { sc_http_req_rate(0) gt 300 }

    # Only the dashboard and API are forced onto HTTPS. Streams stay available
    # on plain HTTP because many radios and legacy players cannot do TLS or
    # follow redirects.
    #
    # The redirect applies to requests for the configured domain. A request
    # made to the server's IP address (from the local network, or before DNS is
    # set up) is served as it came: the certificate is issued for the domain,
    # so sending such a request to HTTPS would only produce a browser warning.
    acl force_https env(FORCE_HTTPS) -m str true
    acl for_domain  req.hdr(host),field(1,:),lower -m str "${DOMAIN}"
    # A request that names a port (http://DOMAIN:8080/) reached this server
    # directly on a port other than 80, so HTTPS is on HTTPS_PORT too. Without
    # one it came on port 80, possibly through a proxy in front, and goes to 443.
    acl host_has_port req.hdr(host) -m reg :[0-9]+$
    http-request redirect location "https://%[req.hdr(host),field(1,:),lower]:${HTTPS_PORT}%[capture.req.uri]" code 301 if is_management force_https for_domain host_has_port !{ ssl_fc } !from_edge !external_tls
    http-request redirect scheme https code 301 if is_management force_https for_domain !{ ssl_fc } !from_edge !external_tls
    http-request redirect location /admin/ code 302 if is_root

    # Let's Encrypt challenges are answered by the dashboard service, from the
    # files certbot leaves in a shared volume (scripts/letsencrypt.sh). They
    # stay on plain HTTP: that is where Let's Encrypt asks for them.
    use_backend management_node_backend if is_management || is_acme
    default_backend streaming_engine_backend

backend management_node_backend
    option httpchk GET /api/v1/health
    server admin_srv admin_dashboard:8000 check resolvers docker init-addr libc,none

backend streaming_engine_backend
    # Each new listener goes to the engine with the fewest listeners (scaled by
    # weight). There are no servers listed here: the admin service adds every
    # engine at runtime, from the list under "Servers" in the dashboard
    # (/api/v1/servers), and re-applies it every few seconds.
    balance leastconn
    option http-no-delay
    # An engine that has no audio or cannot reach a station's source answers
    # 503 or 502 (or not at all); the listener is then tried on another engine
    # instead of failing. This is also what lets an engine discover that a
    # station plays elsewhere and the fault is its own.
    option redispatch 1
    retries 2
    retry-on conn-failure empty-response 502 503
    # Engines accept requests only with this secret, so listeners cannot reach
    # an engine except through here. set-header replaces anything a client sent.
    http-request set-header X-Engine-Auth "${ENGINE_SECRET}"
    option httpchk
    http-check send meth GET uri /healthz hdr X-Engine-Auth "${ENGINE_SECRET}"
    default-server inter 3s fall 3 rise 2

# Redis for slave nodes, wrapped in TLS and still protected by the Redis
# password. Published on the host only when CLUSTER_BIND is set to a reachable
# address (master role). CLUSTER_CERT is the certificate it presents: the
# gateway's own, or an internal one when HTTPS is handled elsewhere. Empty
# means this server takes no slave nodes and the listener is left out.
.if strneq("$CLUSTER_CERT","")
listen cluster_redis
    mode tcp
    bind *:6380 ssl crt "$CLUSTER_CERT"
    option tcplog
    timeout client 5m
    timeout server 5m
    server redis redis_cache:6379 check resolvers docker init-addr libc,none
.endif
