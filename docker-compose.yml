# One file for every role. Which services start is decided by COMPOSE_PROFILES
# in .env, written by install.sh:
#
#   master                 HAProxy, dashboard/API, PostgreSQL, Redis
#   slave                  the audio engine only, enrolled with a master
#   master,local-engine    everything on one server ("both")
#
# The engine and admin images are published by CI (IMAGE_PREFIX, IMAGE_TAG in
# .env) and downloaded, so this file, haproxy.cfg and .env are all a server
# needs. To compile the images from source instead, the source directories and
# docker-compose.build.yml are added (install.sh --build-from-source).
name: streamnode

x-engine-tuning: &engine-tuning
  ALLOW_PRIVATE_SOURCES: ${ALLOW_PRIVATE_SOURCES:-false}
  IDLE_GRACE_SECS: ${IDLE_GRACE_SECS:-10}
  STALL_TIMEOUT_SECS: ${STALL_TIMEOUT_SECS:-10}
  PRIMARY_RETRY_SECS: ${PRIMARY_RETRY_SECS:-30}
  SILENCE_THRESHOLD_DB: ${SILENCE_THRESHOLD_DB:--55}
  METADATA_POLL_SECS: ${METADATA_POLL_SECS:-10}
  BURST_BYTES: ${BURST_BYTES:-65536}

services:
  postgres_db:
    profiles: ["master"]
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-gateway_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dynamic_gateway_fabric

  redis_cache:
    profiles: ["master"]
    image: redis:7-alpine
    restart: always
    # Append-only file so counters not yet written to PostgreSQL survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dynamic_gateway_fabric

  admin_dashboard:
    profiles: ["master"]
    image: ${IMAGE_PREFIX:-streamnode}/admin:${IMAGE_TAG:-latest}
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:-}@postgres_db:5432/${POSTGRES_DB:-gateway_management}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis_cache:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ENGINE_SECRET: ${ENGINE_SECRET:-}
      HAPROXY_ADMIN: haproxy_edge:9999
      # Set on a single-server install, empty on a master-only install.
      LOCAL_ENGINE: ${LOCAL_ENGINE:-}
      CLUSTER_PORT: ${CLUSTER_PORT:-6380}
      CLUSTER_HOST: ${CLUSTER_HOST:-}
      TLS_MODE: ${TLS_MODE:-selfsigned}
      # Repository watched for new versions ("owner/name"); empty turns the check off.
      UPDATE_REPO: ${UPDATE_REPO:-}
      UPDATE_BRANCH: ${UPDATE_BRANCH:-main}
      DEFAULT_MAX_STATIONS: ${DEFAULT_MAX_STATIONS:-5}
      # Local copies of uploaded audio that is also kept in Dropbox, in megabytes.
      FILE_CACHE_MB: ${FILE_CACHE_MB:-2048}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOW_PRIVATE_SOURCES: ${ALLOW_PRIVATE_SOURCES:-false}
      STATS_MINUTE_RETENTION_DAYS: ${STATS_MINUTE_RETENTION_DAYS:-90}
    volumes:
      # Update settings chosen in the dashboard, and what the host's updater reports back.
      - ./control:/control
      # Uploaded idents and fallback audio.
      - media_files:/files
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - dynamic_gateway_fabric

  haproxy_edge:
    profiles: ["master"]
    image: haproxy:2.8-alpine
    restart: always
    user: root
    environment:
      ENGINE_SECRET: ${ENGINE_SECRET:-}
      TLS_MODE: ${TLS_MODE:-selfsigned}
      # The dashboard and API are redirected to HTTPS when asked for by this name.
      DOMAIN: ${DOMAIN:-}
      # Certificate for the Redis link to slave nodes; empty leaves that listener out.
      CLUSTER_CERT: ${CLUSTER_CERT-/etc/haproxy/certs/stream.pem}
      # false serves the dashboard and API over plain HTTP too (local testing only).
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
    ports:
      # Published on every network interface, so the gateway answers on the
      # server's local and public addresses alike. Docker opens these ports in
      # the host firewall itself; no ufw or firewalld rule is needed.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      # Redis over TLS for slave nodes. Bound to loopback unless this server is a master for other servers.
      - "${CLUSTER_BIND:-127.0.0.1}:${CLUSTER_PORT:-6380}:6380"
      # Dashboard/API relay for optional edge servers. Keep on a private address.
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8444}:8444"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/etc/haproxy/certs:ro
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    depends_on:
      - admin_dashboard
      - redis_cache
    networks:
      - dynamic_gateway_fabric

  # The engine on the same server as the master ("both"). Reached only over
  # the internal network.
  audio_engine:
    profiles: ["local-engine"]
    image: ${IMAGE_PREFIX:-streamnode}/engine:${IMAGE_TAG:-latest}
    restart: always
    environment:
      <<: *engine-tuning
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis_cache:6379
      ENGINE_SECRET: ${ENGINE_SECRET:-}
      NODE_ID: local
      # Where idents and fallback audio are fetched from; a slave uses its master's address.
      ADMIN_URL: http://admin_dashboard:8000
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      redis_cache:
        condition: service_healthy
    networks:
      - dynamic_gateway_fabric

  # The engine on a slave node. It enrols with the master and keeps the
  # result in its volume; the master's HAProxy then sends it listeners.
  slave_engine:
    profiles: ["slave"]
    image: ${IMAGE_PREFIX:-streamnode}/engine:${IMAGE_TAG:-latest}
    restart: always
    environment:
      <<: *engine-tuning
      NODE_ID: ${NODE_ID:-}
      MASTER_URL: ${MASTER_URL:-}
      JOIN_TOKEN: ${JOIN_TOKEN:-}
      NODE_SETUP_KEY: ${NODE_SETUP_KEY:-}
      ADVERTISE_ADDRESS: ${ADVERTISE_ADDRESS:-}
      ADVERTISE_PORT: ${ENGINE_PORT:-3000}
      ALLOW_INSECURE_TLS: ${ALLOW_INSECURE_TLS:-false}
      # The engine notes its master's version here, for this server's updater to follow.
      CONTROL_DIR: /control
    ports:
      - "${ENGINE_BIND:-0.0.0.0}:${ENGINE_PORT:-3000}:3000"
    volumes:
      - engine_data:/data
      - ./control:/control
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Optional: only started by scripts/letsencrypt.sh.
  certbot:
    image: certbot/certbot:latest
    profiles: ["letsencrypt"]
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - ./certs:/certs
    networks:
      - dynamic_gateway_fabric

volumes:
  postgres_data:
  redis_data:
  letsencrypt_data:
  engine_data:
  media_files:

networks:
  dynamic_gateway_fabric:
    driver: bridge
